<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .panel { fill: #141c2f; stroke: #7d8fb3; stroke-width: 3; rx: 20; }
      .title { fill: #f5f7ff; font: 700 34px Arial, sans-serif; }
      .label { fill: #d8e2ff; font: 600 20px Arial, sans-serif; }
      .small { fill: #b6c3e6; font: 16px Arial, sans-serif; }
      .pin { fill: #e8edf8; font: 18px Arial, sans-serif; }
      .board { fill: #1f2b44; stroke: #a9b7d4; stroke-width: 3; rx: 24; }
      .wire { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .legend { fill: #0f1728; stroke: #5d6f92; stroke-width: 2; rx: 16; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="720"/>
  <text class="title" x="60" y="64">LaunchDisplay Wiring Schematic</text>
  <text class="small" x="60" y="96">TENSTAR ESP32-C3-Zero to Estardyn 3.5&quot; ST7796S TFT</text>

  <rect class="board" x="70" y="150" width="320" height="500" rx="24"/>
  <text class="label" x="130" y="205">ESP32-C3</text>
  <text class="small" x="118" y="234">TENSTAR Zero</text>

  <rect class="board" x="810" y="150" width="320" height="500" rx="24"/>
  <text class="label" x="885" y="205">TFT Display</text>
  <text class="small" x="860" y="234">Estardyn 3.5&quot; ST7796S</text>

  <rect class="legend" x="430" y="160" width="320" height="480" rx="18"/>
  <text class="label" x="520" y="198">Verified wires</text>
  <text class="pin" x="460" y="250">GPIO4  → SCL / SCLK</text>
  <text class="pin" x="460" y="292">GPIO6  → SDA / MOSI</text>
  <text class="pin" x="460" y="334">GPIO7  → CS</text>
  <text class="pin" x="460" y="376">GPIO1  → DC</text>
  <text class="pin" x="460" y="418">GPIO0  → RST</text>
  <text class="pin" x="460" y="460">GPIO5  → BL</text>
  <text class="pin" x="460" y="502">5V     → VCC</text>
  <text class="pin" x="460" y="544">GND    → GND</text>

  <path class="wire" stroke="#ff9a2e" d="M 390 300 C 420 300, 420 250, 430 250 S 455 250, 460 250"/>
  <path class="wire" stroke="#ffe34d" d="M 390 340 C 420 340, 420 292, 430 292 S 455 292, 460 292"/>
  <path class="wire" stroke="#4d7cff" d="M 390 380 C 420 380, 420 334, 430 334 S 455 334, 460 334"/>
  <path class="wire" stroke="#3cd26f" d="M 390 420 C 420 420, 420 376, 430 376 S 455 376, 460 376"/>
  <path class="wire" stroke="#ffffff" d="M 390 460 C 420 460, 420 418, 430 418 S 455 418, 460 418"/>
  <path class="wire" stroke="#c26cff" d="M 390 500 C 420 500, 420 460, 430 460 S 455 460, 460 460"/>
  <path class="wire" stroke="#ff4d4d" d="M 390 540 C 420 540, 420 502, 430 502 S 455 502, 460 502"/>
  <path class="wire" stroke="#808080" d="M 390 580 C 420 580, 420 544, 430 544 S 455 544, 460 544"/>

  <text class="small" x="100" y="585">C3 pin side</text>
  <text class="small" x="902" y="585">Display header</text>
</svg>
